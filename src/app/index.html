<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCUGen Hero Forge</title>
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DCUGen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Random and custom character generator and GM toolkit for the DC Adventures RPG, built on the Mutants & Masterminds 3e rules.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=UnifrakturCook:wght@700&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Caveat:wght@500;700&family=Permanent+Marker&family=Rye&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#forge" data-tab="forge" aria-label="DCUGen home">
      <span class="brand-mark" aria-hidden="true">DCU</span><span class="brand-name">Gen</span>
      <span class="brand-sub">Hero Forge · DC Adventures rules</span>
    </a>
    <div class="top-tools">
      <button class="icon-btn theme-toggle" id="theme-toggle" type="button" title="Switch light or dark theme" aria-label="Switch light or dark theme">◐</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <span class="tab-group" data-group="Characters">
        <button class="tab" role="tab" id="tab-forge" data-tab="forge" aria-selected="true" title="Make and edit characters">Forge</button>
        <button class="tab" role="tab" id="tab-roster" data-tab="roster" aria-selected="false" title="Everyone you've saved">Roster <span class="count" id="roster-count">0</span></button>
        <button class="tab" role="tab" id="tab-lab" data-tab="lab" aria-selected="false" title="Build custom powers">Power Lab</button>
        <button class="tab" role="tab" id="tab-garage" data-tab="garage" aria-selected="false" title="Equipment, vehicles and headquarters">Gear &amp; Vehicles</button>
      </span>
      <span class="tab-sep" aria-hidden="true"></span>
      <span class="tab-group" data-group="Play">
        <button class="tab" role="tab" id="tab-table" data-tab="table" aria-selected="false" title="Dice, chat and joining a game">Table <span class="count" id="table-count" hidden></span></button>
        <button class="tab" role="tab" id="tab-battle" data-tab="battle" aria-selected="false" title="Put anyone against anyone">Battle Room</button>
      </span>
      <span class="tab-sep gm-only" aria-hidden="true"></span>
      <span class="tab-group gm-only" data-group="Run the game">
        <button class="tab" role="tab" id="tab-screen" data-tab="screen" aria-selected="false" title="Run a live session">GM Screen</button>
        <button class="tab" role="tab" id="tab-world" data-tab="world" aria-selected="false" title="The campaign: people, places, sessions">World</button>
        <button class="tab" role="tab" id="tab-bestiary" data-tab="bestiary" aria-selected="false" title="Ready-made creatures and foes">Bestiary</button>
        <button class="tab" role="tab" id="tab-workshop" data-tab="workshop" aria-selected="false" title="Generators and homebrew">Workshop</button>
        <button class="tab" role="tab" id="tab-gm" data-tab="gm" aria-selected="false" title="Dice charts, calculators and generators">GM Tools</button>
      </span>
      <span class="tab-sep" aria-hidden="true"></span>
      <button class="tab" role="tab" id="tab-rules" data-tab="rules" aria-selected="false" title="Searchable rules reference">Rules</button>
      <button class="tab tab-mode" type="button" id="mode-toggle" title="Show or hide the GM sections" aria-pressed="false">GM sections ▾</button>
    </nav>
  </header>

  <main>
    <section class="view" id="view-forge" role="tabpanel" aria-labelledby="tab-forge"></section>
    <section class="view" id="view-roster" role="tabpanel" aria-labelledby="tab-roster" hidden></section>
    <section class="view" id="view-lab" role="tabpanel" aria-labelledby="tab-lab" hidden></section>
    <section class="view" id="view-bestiary" role="tabpanel" aria-labelledby="tab-bestiary" hidden></section>
    <section class="view" id="view-workshop" role="tabpanel" aria-labelledby="tab-workshop" hidden></section>
    <section class="view" id="view-garage" role="tabpanel" aria-labelledby="tab-garage" hidden></section>
    <section class="view" id="view-battle" role="tabpanel" aria-labelledby="tab-battle" hidden></section>
    <section class="view" id="view-world" role="tabpanel" aria-labelledby="tab-world" hidden></section>
    <section class="view" id="view-table" role="tabpanel" aria-labelledby="tab-table" hidden></section>
    <section class="view" id="view-screen" role="tabpanel" aria-labelledby="tab-screen" hidden></section>
    <section class="view" id="view-gm" role="tabpanel" aria-labelledby="tab-gm" hidden></section>
    <section class="view" id="view-rules" role="tabpanel" aria-labelledby="tab-rules" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog class="dialog" id="dialog"></dialog>
</div>
<script src="storage-boot.js"></script>
<script src="../vendor/peerjs.min.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../vendor/three.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
