# Builds the desktop app installers on every push to main and publishes them as a GitHub release,
# so "Get the app" on the website always points at the newest build and installed apps update
# themselves (electron-updater reads latest.yml from the release).
name: Desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # One job makes the release first, so the three builders only upload into it (making it from three
  # jobs at once failed with "already_exists" for whichever came last).
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Pick the version (6.1.<build number>)
        id: v
        run: echo "version=6.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DCUGen $V" --latest \
                 --notes "Desktop app build $V from $GITHUB_SHA. Windows: DCUGen-Setup.exe (installer, updates itself) or DCUGen-Portable.exe. macOS: DCUGen.dmg. Linux: DCUGen.AppImage."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the web app
        run: npm run build
      - name: Stamp the version (6.1.<build number>)
        shell: bash
        run: |
          cd desktop
          v="${{ needs.release.outputs.version }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$v"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Install Electron
        shell: bash
        run: |
          cd desktop
          npm install --no-audit --no-fund
          npm run prepare-app
      - name: Build and publish installers
        shell: bash
        run: |
          cd desktop
          npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installers as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: dcugen-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.yml
          if-no-files-found: ignore
