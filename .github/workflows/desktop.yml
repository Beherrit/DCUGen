# Builds the desktop app installers on every push to main and publishes them as a GitHub release,
# so "Get the app" on the website always points at the newest build and installed apps update
# themselves (electron-updater reads latest.yml from the release).
name: Desktop app

on:
  push:
    branches: [main]
  # Pull requests only run the tests; the release and builds below are for main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  # Nothing is released unless every test passes: installed apps update themselves from these releases.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: Node 20's test runner doesn't expand the tests/**/*.test.mjs pattern in npm test.
          node-version: 22
      - name: Test
        run: npm test
      - name: Check every catalog creature against the PL limits
        run: npm run validate

  # The built app in a real browser: roll, edit, save, reload, share keys, every tab, a phone screen.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Browser tests
        run: npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # One job makes the release first, so the three builders only upload into it (making it from three
  # jobs at once failed with "already_exists" for whichever came last).
  release:
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Pick the version (6.1.<build number>)
        id: v
        run: echo "version=6.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DCUGen $V" --latest \
                 --notes "Desktop app build $V from $GITHUB_SHA. The single-file app: DCUGen.html (open it in any browser). Windows: DCUGen-Setup.exe (installer, updates itself) or DCUGen-Portable.exe. macOS: DCUGen.dmg. Linux: DCUGen.AppImage."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the web app
        run: npm run build
      # The single-file app is built here rather than committed (it is 4 MB, and a copy per commit made the
      # repository huge). The README's download link points at this asset of the latest release.
      - name: Publish DCUGen.html with the release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.release.outputs.version }}" DCUGen.html --clobber --repo "$GITHUB_REPOSITORY"
      - name: Stamp the version (6.1.<build number>)
        shell: bash
        run: |
          cd desktop
          v="${{ needs.release.outputs.version }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$v"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Install Electron
        shell: bash
        run: |
          cd desktop
          npm install --no-audit --no-fund
          npm run prepare-app
      - name: Build and publish installers
        shell: bash
        run: |
          cd desktop
          npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installers as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: dcugen-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.yml
          if-no-files-found: ignore
