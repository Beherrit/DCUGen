# Builds the desktop app installers on every push to main and publishes them as a GitHub release,
# so "Get the app" on the website always points at the newest build and installed apps update
# themselves (electron-updater reads latest.yml from the release).
name: Desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the web app
        run: npm run build
      - name: Stamp the version (6.1.<build number>)
        shell: bash
        run: |
          cd desktop
          v="6.1.${{ github.run_number }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$v"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Install Electron
        shell: bash
        run: |
          cd desktop
          npm install --no-audit --no-fund
          npm run prepare-app
      - name: Build and publish installers
        shell: bash
        run: |
          cd desktop
          npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installers as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: dcugen-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.yml
          if-no-files-found: ignore
